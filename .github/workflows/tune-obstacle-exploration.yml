name: Tune snake obstacle exploration

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/tune-obstacle-exploration.yml

permissions:
  contents: write

jobs:
  tune:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply tuning
        run: python .github/scripts/tune_snake_obstacle.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Improve obstacle lift exploration"
          git push
