name: Add privileged obstacle observation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-privileged-obstacle-observation.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add privileged obstacle state to observation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import py_compile

          def replace_exact(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != expected:
                  raise RuntimeError(f'{path}: expected {expected} occurrences, found {count}: {old!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          replace_exact(
              'sac/config.py',
              '    front_stage_height_margin: float = 0.015\n    initial_ground_clearance: float = 0.003\n',
              '    front_stage_height_margin: float = 0.015\n    privileged_obstacle_distance_scale: float = 1.0\n    initial_ground_clearance: float = 0.003\n',
          )

          replace_exact(
              'sac/config.py',
              '    obs_dim: int = 510\n',
              '    obs_dim: int = 520\n',
          )

          replace_exact(
              'sac/env.py',
              '        self.observation_dim = lidar_dim + 30\n',
              '        self.observation_dim = lidar_dim + 40\n',
          )

          marker = '''    def _get_obs(self, state: Optional[Dict[str, np.ndarray]] = None) -> np.ndarray:\n'''
          privileged_method = '''    def _get_privileged_obstacle_obs(self) -> np.ndarray:\n        front_progress, _ = self._front_tip_state()\n        base_progress = self._course_progress(self.data.xpos[self.base_id, :2])\n        rear_progress = self._course_progress(self.data.xpos[self.back_track_body_id, :2])\n        distance_scale = max(float(self.cfg.privileged_obstacle_distance_scale), 1e-6)\n        height_scale = max(float(self.cfg.obstacle_max_supported_height), 1e-6)\n        return np.array([\n            (front_progress - self.obstacle_start_progress) / distance_scale,\n            (front_progress - self.obstacle_end_progress) / distance_scale,\n            (base_progress - self.obstacle_start_progress) / distance_scale,\n            (base_progress - self.obstacle_end_progress) / distance_scale,\n            (rear_progress - self.obstacle_start_progress) / distance_scale,\n            (rear_progress - self.obstacle_end_progress) / distance_scale,\n            self.obstacle_height / height_scale,\n            float(self.stage_front_track),\n            float(self.stage_base),\n            float(self.stage_back_track),\n        ], dtype=np.float64)\n\n'''
          replace_exact('sac/env.py', marker, privileged_method + marker)

          old_obs = '''        obs = np.concatenate([self.lidar_scan.reshape(-1).astype(np.float64) / self.cfg.lidar_max_range, state["projected_gravity"], state["base_ang_vel"] / self.cfg.angular_velocity_scale, state["base_lin_vel"] / self.cfg.linear_velocity_scale, state["goal_local"] / self.cfg.goal_position_scale, np.array([float(state["goal_distance"]) / self.cfg.goal_position_scale]), np.array([np.sin(heading_error), np.cos(heading_error)]), (state["q"] - self.q_nominal) / np.maximum(self.joint_action_scale, 0.20), state["dq"] / self.cfg.joint_velocity_scale, state["track_omega"] / self.cfg.track_speed_limit, self.filtered_action])\n'''
          new_obs = '''        privileged_obstacle_obs = self._get_privileged_obstacle_obs()\n        obs = np.concatenate([self.lidar_scan.reshape(-1).astype(np.float64) / self.cfg.lidar_max_range, state["projected_gravity"], state["base_ang_vel"] / self.cfg.angular_velocity_scale, state["base_lin_vel"] / self.cfg.linear_velocity_scale, state["goal_local"] / self.cfg.goal_position_scale, np.array([float(state["goal_distance"]) / self.cfg.goal_position_scale]), np.array([np.sin(heading_error), np.cos(heading_error)]), (state["q"] - self.q_nominal) / np.maximum(self.joint_action_scale, 0.20), state["dq"] / self.cfg.joint_velocity_scale, state["track_omega"] / self.cfg.track_speed_limit, self.filtered_action, privileged_obstacle_obs])\n'''
          replace_exact('sac/env.py', old_obs, new_obs)

          for file_name in ('sac/config.py', 'sac/env.py', 'sac/train.py', 'sac/play.py', 'sac/sac.py'):
              py_compile.compile(file_name, doraise=True)

          Path('.github/workflows/add-privileged-obstacle-observation.yml').unlink()
          PY

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Add privileged obstacle state observation"
          git push
